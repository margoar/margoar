name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate profile files
        run: |
          test -f README.md
          test -f gh-stats.svg
          test -f gh-stats-language.svg

          echo "✅ Profile files are valid"
